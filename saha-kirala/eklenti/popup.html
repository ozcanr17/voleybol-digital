<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:#f5f7fb; --card:#fff; --ink:#141c33; --muted:#6a7490; --line:#e2e7f0;
    --line2:#eef1f7; --accent:#2b5cf0; --accent-soft:#2b5cf014;
    --ok:#0e8a5f; --ok-soft:#0e8a5f14; --warn:#ad5c09; --warn-soft:#ad5c0914;
    --err:#c92a4b; --err-soft:#c92a4b14; --code:#0d1326;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b0f1c; --card:#151b2c; --ink:#e9edf7; --muted:#98a2bd; --line:#28304a;
      --line2:#212940; --accent:#7ea1ff; --accent-soft:#7ea1ff1c;
      --ok:#4ac996; --ok-soft:#4ac9961c; --warn:#e5a752; --warn-soft:#e5a75218;
      --err:#ff7d93; --err-soft:#ff7d9320; --code:#070b16;
    }
  }
  * { box-sizing:border-box; }
  body { width:330px; margin:0; padding:15px; background:var(--bg); color:var(--ink);
         font:13.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:15px; margin:0 0 3px; }
  .lede { color:var(--muted); font-size:12px; margin:0 0 13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:13px; margin-bottom:11px; }
  .satir { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .rozet { padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:700;
           background:var(--line2); color:var(--muted); }
  .rozet.run { background:var(--accent-soft); color:var(--accent); }
  .rozet.ok  { background:var(--ok-soft); color:var(--ok); }
  .rozet.err { background:var(--err-soft); color:var(--err); }
  .rozet.warn{ background:var(--warn-soft); color:var(--warn); }
  #geri { margin-left:auto; font-size:19px; font-weight:600;
          font-variant-numeric:tabular-nums; }
  #hedef { color:var(--muted); font-size:12px; margin-bottom:10px; }
  #kayit { background:var(--code); color:#c9d3ee; border-radius:7px; padding:9px;
           height:140px; overflow-y:auto; font:11px/1.55 ui-monospace,Consolas,monospace;
           white-space:pre-wrap; word-break:break-word; }
  #kayit .t { color:#5c6785; }
  #kayit .iyi { color:#7fe0b0; }
  #kayit .hata { color:#ff8fa3; }
  .btn { display:block; width:100%; text-align:center; text-decoration:none;
         font:inherit; font-size:13.5px; font-weight:650; padding:10px 14px;
         border-radius:8px; border:1px solid transparent; cursor:pointer;
         background:var(--accent); color:#fff; }
  .btn.ghost { background:transparent; border-color:var(--line); color:var(--ink);
               font-weight:500; margin-top:8px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .not { font-size:11.5px; color:var(--muted); margin:10px 0 0; }
</style>
</head>
<body>
  <h1>Saha Kiralama</h1>
  <p class="lede">Motor çalışıyor. Ayarlar ve başlatma arayüzde.</p>

  <div class="card">
    <div class="satir">
      <span id="rozet" class="rozet">boşta</span>
      <span id="geri">--:--:--</span>
    </div>
    <div id="hedef"></div>
    <div id="kayit"></div>
  </div>

  <a class="btn" id="arayuz" href="https://voleybol.digital/saha-kirala/"
     target="_blank" rel="noopener">Arayüzü aç</a>
  <button class="btn ghost" id="durdur" disabled>Durdur</button>

  <p class="not">Bu pencere yalnızca durumu gösterir. Yeni bir iş başlatmak için
     arayüzü kullanın.</p>

  <script src="popup.js"></script>
</body>
</html>
